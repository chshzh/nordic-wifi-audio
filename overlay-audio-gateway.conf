CONFIG_AUDIO_GATEWAY=y
# Run as socket server waiting for client to connect
CONFIG_SOCKET_ROLE_SERVER=y

# The encoder thread blocks in send_audio_frame() while Wi-Fi transmits, and USB keeps
# filling fifo_rx at 1 blk/ms the whole time. At the default of 1 frame the FIFO is only
# 10 ms deep, so any TX stall past 10 ms overruns it and discards audio (audible click).
# 4 frames = 40 ms of slack; unused in steady state, so it adds no latency.
CONFIG_FIFO_RX_FRAME_COUNT=4

# P2P Wi-Fi Direct: NRF70_P2P_MODE / NRF70_AP_MODE / WIFI_NM_WPA_SUPPLICANT_P2P
# are set by the wifi-p2p snippet when -Dnordic-wifi-audio_SNIPPET=wifi-p2p is used.
# DHCP server for P2P_GO (assigns 192.168.7.2 to P2P_GC)
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=3
# Static IP for P2P_GO gateway
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.7.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.7.1"

# Gateway uses P2P_GO mode only — disable GC so the banner and shell
# don't offer it as a selectable mode on this device. With GC disabled and GO
# enabled, the zego choice auto-selects P2P_GO as the fresh-flash default (no
# explicit DEFAULT_MODE needed), and STA-only builds fall back to STA cleanly.
CONFIG_ZEGO_WIFI_MODE_P2P_GC_ENABLED=n

# -Device Drivers START
# --Wi-Fi drivers START
# ---nRF70 driver START
# Increased from 15000 to handle more scan results (prevents allocation failures)
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=30000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=40000
# Critical for socket packet low latency transmission
CONFIG_NRF_WIFI_LOW_POWER=n
CONFIG_NRF70_RX_NUM_BUFS=10
CONFIG_NRF70_RX_MAX_DATA_SIZE=1600
CONFIG_NRF70_MAX_TX_AGGREGATION=4
CONFIG_NRF70_MAX_TX_TOKENS=8
# Increased to accommodate raw PCM frames (1920 bytes + 5 bytes header/footer = 1925 bytes)
CONFIG_NRF70_TX_MAX_DATA_SIZE=2048
# ----nRF70 driver END
# --Wi-Fi drivers END
# -Device Drivers START

# -Subsystems and OS Services START
# --Networking START

# Network buffer management for high throughput
CONFIG_NET_PKT_RX_COUNT=5
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=5
CONFIG_NET_BUF_TX_COUNT=20
# CONFIG_NET_PKT_RX_COUNT*CONFIG_NET_BUF_DATA_SIZE
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=7500
# CONFIG_NET_PKT_TX_COUNT*CONFIG_NET_BUF_DATA_SIZE
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=30000
# Network management event queue sizing
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
# CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000 (default)

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="audiogateway"

# WPA supplicant thread needs more stack for P2P GO AP setup (wpa_drv_zep_set_ap)
# prj.conf has 5982 which is tuned for STA; P2P GO AP path needs at least 8192
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=8192
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=5632
# --Networking END
# -Subsystems and OS Services END
