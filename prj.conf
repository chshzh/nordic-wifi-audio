#------------------------------------------------------------------------#
# -zego brick library START
# CONFIG_ZEGO_BUTTON and CONFIG_ZEGO_LED are set per-board in boards/*.conf
# (button/LED counts differ: nRF5340 Audio DK has 5/9, nRF7002DK has 2/2)
CONFIG_ZEGO_WIFI=y
CONFIG_ZEGO_NETWORK=y
CONFIG_ZEGO_MEMONITOR=y
CONFIG_ZEGO_MEMONITOR_INTERVAL_MS=5000
CONFIG_ZEGO_MEMONITOR_ZVIEW=y
# memonitor guards mbedTLS heap stats with CONFIG_MBEDTLS_MEMORY_DEBUG;
# disable it since mbedtls_memory_buffer_alloc_* are not linked in this config
CONFIG_MBEDTLS_MEMORY_DEBUG=n
# CONFIG_ZEGO_WIFI_BLE_PROV: not loaded (wifi_ble_prov brick not in EXTRA_ZEPHYR_MODULES)
CONFIG_APP_UX_MODULE=y
# memonitor requires INIT_STACKS=y (stacks filled with 0xaa for HWM measurement)
# and STACK_SENTINEL=n (sentinel overwrites 0xaa, breaking HWM counts)
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=n
# Version tracking — update to newest Changelog timestamp when re-syncing code to docs
CONFIG_ZEGO_APP_PRD_VERSION="2026-06-22-15-18"
CONFIG_ZEGO_APP_SPECS_VERSION="2026-06-22-15-18"
# -zego brick library END
#------------------------------------------------------------------------#
