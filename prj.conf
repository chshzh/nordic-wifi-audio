#------------------------------------------------------------------------#
# -Application Configuration START
CONFIG_SOCKET_STACK_SIZE=6144
CONFIG_ENCODER_STACK_SIZE=24000
CONFIG_BUTTON_PUBLISH_STACK_SIZE= 512
# -Application Configuration END
