#------------------------------------------------------------------------#
# -General Kernel Options START
CONFIG_MAIN_STACK_SIZE=4096
# sysworkq runs WiFi net-mgmt events + DNS-SD resolve callbacks + audio stream
# auto-start; 2048 overflowed and corrupted a k_sem wait-queue (BUS FAULT in
# k_sem_give->sys_dlist_remove). Bumped per skill gotcha (>=6144 for WiFi work).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=70000
CONFIG_INIT_STACKS=y
# MPU stack guard: turn the next undersized stack into a clean, named fault
# instead of silent memory corruption. MPU region guard — independent of the
# STACK_SENTINEL=n / INIT_STACKS HWM fill that memonitor relies on.
CONFIG_MPU_STACK_GUARD=y
# -General Kernel Options END

#------------------------------------------------------------------------#
# WiFi / net subsystem thread stacks — values referenced from
# nordic-wifi-memfault/prj.conf (ZView watermark-measured, app-independent
# since these threads do identical WiFi-stack work in every app).
# App-specific heaps and the nordic-wifi-memfault dedicated-heap split are
# intentionally NOT copied (audio's 70000 system heap backs audio buffers,
# opus, and sockets). Re-measure with ZView after a streaming session
# (chsh-sk-ncs-3.3-memopt) to set final per-workload values.
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=5982
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=4810
CONFIG_NRF70_BH_WQ_STACK_SIZE=1340
CONFIG_NRF70_IRQ_WQ_STACK_SIZE=840
CONFIG_L2_WIFI_CONN_WQ_STACK_SIZE=276
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4480
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
#------------------------------------------------------------------------#
#------------------------------------------------------------------------#

