# Configuration coverage priority:
# Command line > Overlay files > project boards/<board>.conf > prj.conf > Board defconfig
# (highest)                                                              (lowest)

# This file contains only:
#   - System-level configuration that belongs to no single module
#   - Module enable/disable flags
#   - Log-level choices (cannot be set via Kconfig.defaults)
#   - Project-specific overrides that differ from module defaults
#   - Hardware-specific memory and stack tuning
# Module-specific defaults live in each module's Kconfig.defaults file.

# =========================================================================
# General System Configuration
# =========================================================================
CONFIG_REBOOT=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_DEPRECATION_TEST=y

# Stack fill for ZView HWM watermark measurement; SENTINEL=n so the 0xaa fill
# isn't overwritten before memonitor reads it.
CONFIG_INIT_STACKS=y
CONFIG_STACK_SENTINEL=n

# =========================================================================
# Flash / Storage
# =========================================================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# Confine image to slot0_partition. Without this the linker uses the full 1 MB
# and silently overflows into storage_partition, corrupting .data init.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# =========================================================================
# Module Enable / Disable
# =========================================================================

# --- Libraries ---
CONFIG_DK_LIBRARY=y
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_NET_MAC=y

# --- zego bricks ---
CONFIG_ZEGO_WIFI=y
CONFIG_ZEGO_NETWORK=y
# zego/bricks/ux owns the mode-control button gestures, the LED 0 Wi-Fi state
# machine, and the startup banner (zego_ux_print_banner(), called from main()).
# src/modules/ux overrides its long-press hook to keep this project's
# SoftAP-excluded mode cycle. Replaces the former CONFIG_APP_UX_MODULE.
CONFIG_ZEGO_UX=y
# Enable the button brick's 2nd hold tier (BUTTON_LONGER_PRESS) so the
# mode-control button (CONFIG_ZEGO_UX_BUTTON_IDX) serves both gestures: 3 s
# hold = Wi-Fi mode cycle (zego/ux's guarded BUTTON_LONG_PRESS, via this
# app's ux.c override, unchanged), 10 s hold = factory reset
# (zego/factory_reset). The 3 s action is deferred to release instead of
# firing at 3 s, so a hold continuing to 10 s supersedes it — see
# zego/bricks/button/docs/button-spec.md "Two-Tier Hold Gesture".
CONFIG_ZEGO_BUTTON_LONGER_PRESS_MS=10000
# Factory reset (zego/factory_reset): erases Wi-Fi credentials + saved Wi-Fi
# mode + P2P GO MAC, then reboots. Triggered by the 10 s button hold above
# and/or the 'zego_factory_reset' shell command.
CONFIG_ZEGO_FACTORY_RESET=y
CONFIG_ZEGO_FACTORY_RESET_LOG_LEVEL_INF=y
# P2P_GC target-GO MAC lives in overlay-audio-headset.conf (headset + P2P only) —
# it depends on WIFI_NM_WPA_SUPPLICANT_P2P, so keeping it out of the shared base
# avoids a Kconfig warning on gateway and STA-only (no-snippet) builds.
# ZView-only: firmware sampler disabled, ZView reads stack/heap watermarks over SWD
CONFIG_ZEGO_MEMONITOR=y
CONFIG_ZEGO_MEMONITOR_ZVIEW=y

# --- Shell ---
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192

# --- zbus ---
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32

# =========================================================================
# WiFi Infrastructure
# =========================================================================
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_ETHERNET=y
# WEP and WPA1/TKIP (LEGACY_CRYPTO) are cryptographically broken and have been
# out of Wi-Fi Alliance certification since 2004 / 2012 respectively. This app
# only uses WPA2/WPA3-PSK and P2P, neither of which touches either symbol, so
# turning them off costs nothing and removes 4 Kconfig warnings. Matches the
# same decision in nordic-wifi-memfault and nordic-wifi-webdash.
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n

# WiFi credentials — stored in ZMS/settings, auto-connect on boot in STA mode
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y

# WiFi shell — interactive `wifi` / `wifi p2p` commands for STA provisioning
# and P2P debugging. Costs ~10 KB flash; offset by CONFIG_NET_LOG=n below.
CONFIG_NET_L2_WIFI_SHELL=y

# L2 connectivity manager — drives auto-connect and auto-down on STA mode
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=y

# =========================================================================
# Networking
# =========================================================================
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
# This app is UDP-only. zego/bricks/network gained CONFIG_ZEGO_NETWORK_TCP
# (default y, selects NET_TCP) in v3.4.0.2, which silently overrode the
# CONFIG_NET_TCP=n below — turning the TCP stack back on costs several KB of
# flash in an image that already sits at ~98 % of slot0.
CONFIG_ZEGO_NETWORK_TCP=n
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# mDNS responder + DNS-SD — gateway advertises audio service so the headset
# can discover its DHCP address in STA mode without a hardcoded IP
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y
# DNS resolver — headset uses this for DNS-SD PTR→A lookups in STA mode
CONFIG_DNS_RESOLVER=y

# Socket/connection budget for the dual-mode (P2P + STA-with-mDNS) build.
# Concurrent bound UDP sockets: app audio socket + mDNS responder (5353) +
# DNS resolver + hostap control, plus the P2P_GO DHCP server (port 67). The
# default NET_MAX_CONN=4 is exhausted before the DHCP server can bind its
# socket ("net_conn: Not enough connection contexts"), so the server fails to
# start and P2P clients never receive 192.168.7.2. Each bound socket also uses
# one net_context, so NET_MAX_CONTEXTS must be >= NET_MAX_CONN.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8

# memonitor.c is guarded by CONFIG_MBEDTLS_MEMORY_DEBUG; keep it n since
# mbedtls_memory_buffer_alloc_* are not linked in this build configuration
CONFIG_MBEDTLS_MEMORY_DEBUG=n

# NET_LOG=n removes all net-subsystem module log registrations from flash
# (log_const_area + log_dynamic_area entries + format strings). Required to fit
# the P2P image with WiFi shell within slot0_partition (1016 KB). All WiFi
# shell commands and net_mgmt events still work; only net-module log output is
# suppressed. App/zego/net_event modules use their own LOG_MODULE_REGISTER and
# are unaffected.
CONFIG_NET_LOG=n

# =========================================================================
# Logging
# =========================================================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Drop wpa_supplicant to ERR: its log-string table is very large with P2P/AP/WPS
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_ERR=y
# Verbose assert strings (~3-8 KB) are unnecessary in a flash-constrained build
CONFIG_ASSERT_VERBOSE=n
# cbprintf float support: no log call in this app uses %f/%g, so exclude the
# FP formatting library from cbprintf_complete (~3-8 KB saved)
CONFIG_CBPRINTF_FP_SUPPORT=n
# %n specifier is unused and adds code; remove it
CONFIG_CBPRINTF_N_SPECIFIER=n
# Runtime log filtering stores a 4-byte filter word per log source in the
# log_dynamic_area flash init table. With LOG_RUNTIME_FILTERING=n that section
# is eliminated. Runtime log level changes via the shell `log` command stop
# working but wifi/audio functionality is unaffected.
CONFIG_LOG_RUNTIME_FILTERING=n

# =========================================================================
# Memory & Stack Configuration
# =========================================================================
CONFIG_MAIN_STACK_SIZE=4096
# sysworkq runs WiFi net-mgmt events + audio auto-start; >=6144 for WiFi work
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Audio PCM buffers + Opus + sockets
CONFIG_HEAP_MEM_POOL_SIZE=70000

# App-specific thread stacks
CONFIG_SOCKET_STACK_SIZE=6144
CONFIG_ENCODER_STACK_SIZE=24000
CONFIG_BUTTON_PUBLISH_STACK_SIZE=512

# WiFi / net subsystem thread stacks (ZView watermark-measured, STA workload)
# P2P overlays (headset + gateway) bump SUPPLICANT to 8192/5632 for the P2P join path
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=5982
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=4810
CONFIG_NRF70_BH_WQ_STACK_SIZE=1340
CONFIG_NRF70_IRQ_WQ_STACK_SIZE=840
CONFIG_L2_WIFI_CONN_WQ_STACK_SIZE=276
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4480
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=5520
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# =========================================================================
# Optimization
# =========================================================================
# C Library
CONFIG_PICOLIBC=y
CONFIG_MINIMAL_LIBC=n
CONFIG_NEWLIB_LIBC=n
# Compiler optimizations will be set to -Os 
CONFIG_SIZE_OPTIMIZATIONS=y
# Link Time Optimization
CONFIG_LTO=y
# CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_TASK_WDT=n

# =========================================================================
# Version
# =========================================================================
CONFIG_APP_PRD_VERSION="2026-08-04-10-56"
CONFIG_APP_SPECS_VERSION="2026-08-04-13-08"
