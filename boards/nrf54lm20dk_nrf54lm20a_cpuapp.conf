# Board-specific overrides for nRF54LM20DK + nRF7002EB II shield.
# nRF54LM20A is a single-core SoC (no CPUNET) with RRAM (no NVM controller).
# No I2S peripheral and no RTC0 on nRF54LM20A — audio_i2s.c and
# audio_sync_timer.c are excluded from compilation via CMakeLists guards.
# Gateway uses USB as audio source by default.

# Force the usbhs (DWC2) controller to Full-Speed for UAC2 audio. High-Speed
# enumeration caused the host's isochronous OUT stream to be continuously
# cancelled (no PCM delivered), starving the Wi-Fi audio stream. Full-Speed is
# the validated-working mode (as on the nRF5340 usbd boards). Driving the HS
# endpoint correctly (125 us micro-framing) remains future work.
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n

# nRF7002EB2 on nRF54LM20DK does not wire the SR coexistence RF switch.
CONFIG_NRF70_SR_COEX=n
CONFIG_NRF70_SR_COEX_RF_SWITCH=n

# MPSL registers RADIO/TIMER/RTC interrupts at priority 0 with IRQ_ZERO_LATENCY.
# On this single-core SoC those ISRs can fire inside a K_SPINLOCK block and
# trigger a false-positive "Not my spinlock" assert. Disable the debug check.
CONFIG_SPIN_VALIDATE=n

# Wi-Fi provisioning over BLE uses 1M PHY only on single-core devices.
CONFIG_BT_CTLR_PHY_2M=n

# nRF54LM20DK has no SD card; disable FAT filesystem to avoid FF_VOLUMES=0 error
# (Kconfig.defaults unconditionally enables FAT_FILESYSTEM_ELM, but with no
# disk DTS nodes the FatFS volume count would be 0, which is invalid)
CONFIG_FAT_FILESYSTEM_ELM=n

# zego button/LED brick configuration for nRF54LM20DK
# Note: BUTTON 3 is unavailable when nRF7002EB2 shield is attached
CONFIG_ZEGO_BUTTON=y
CONFIG_ZEGO_BUTTON_NUM_BUTTONS=3
CONFIG_ZEGO_BUTTON_BACKEND_DK=y
CONFIG_ZEGO_LED=y
CONFIG_ZEGO_LED_NUM_LEDS=4
CONFIG_ZEGO_LED_BACKEND_DK=y
