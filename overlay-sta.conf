# STA mode overlay — overrides P2P default for infrastructure Wi-Fi.
# Use with overlay-audio-gateway.conf or overlay-audio-headset.conf.
# Opus codec is only valid in STA mode; use together with overlay-opus.conf.
# P2P + Opus is explicitly not supported (RAM constraint — see NFR-005).
CONFIG_ZEGO_WIFI_DEFAULT_MODE_STA=y
