# WiFi support
SB_CONFIG_WIFI_NRF70=y

# Network core image configuration for nRF5340
# Use empty network core image by default (can be overridden if needed)
SB_CONFIG_NETCORE_NONE=y

# Use DTS-based flash partitioning; Partition Manager is deprecated in NCS v3.3.0
SB_CONFIG_PARTITION_MANAGER=n
