manifest:
  version: "0.13"

  defaults:
    remote: ncs

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: chshzh
      url-base: https://github.com/chshzh

  projects:
    # NCS v3.4.0 — imports zephyr, bootloader, modules, nrfxlib, tools, etc.
    - name: sdk-nrf
      path: nrf
      revision: v3.4.0
      import: true
      remote: ncs

    # Common app modules and libraries
    - name: zego
      path: zego
      revision: v3.4.0.4
      remote: chshzh

    # # Add more sibling projects as needed:
    # - name: nordic-wifi-webdash
    #   path: nordic-wifi-webdash
    #   revision: main
    #   remote: chshzh

    # - name: nordic-wifi-memfault
    #   path: nordic-wifi-memfault
    #   revision: main
    #   remote: chshzh

    - name: zview
      url: https://github.com/chshzh/zview
      revision: main
      path: modules/tools/zview
      west-commands: scripts/west-commands.yml

    # Opus codec source (replaces the former lib/opus git submodule).
    # Pulled to modules/lib/opus alongside the other NCS modules; pinned to v1.5.2.
    - name: opus
      url: https://github.com/xiph/opus
      revision: v1.5.2
      path: modules/lib/opus

  self:
    path: nordic-wifi-audio
