CONFIG_AUDIO_HEADSET=y
CONFIG_SOCKET_ROLE_CLIENT=y

# P2P Wi-Fi Direct: NRF70_P2P_MODE / NRF70_AP_MODE / WIFI_NM_WPA_SUPPLICANT_P2P
# are set by the wifi-p2p snippet when -Dnordic-wifi-audio_SNIPPET=wifi-p2p is used.
# Headset uses P2P_GC mode only — disable GO so the banner and shell
# don't offer it as a selectable mode on this device. With GO disabled and GC
# enabled, the zego choice auto-selects P2P_GC as the fresh-flash default (no
# explicit DEFAULT_MODE needed), and STA-only builds fall back to STA cleanly.
CONFIG_ZEGO_WIFI_MODE_P2P_GO_ENABLED=n

# Auto-connect to the gateway by its exact device MAC. The brick issues
# 'p2p connect <MAC> pin 12345678 --join' directly (BSS scan + associate),
# which works reliably against an autonomous P2P_GO. Prefix/OUI mode is NOT
# usable with an autonomous GO (it never enters P2P listen state, so P2P_FIND
# returns 0 peers). Set this to YOUR gateway's MAC (see its boot banner).
# Headset + P2P only — depends on WIFI_NM_WPA_SUPPLICANT_P2P from the snippet.
CONFIG_ZEGO_WIFI_P2P_GC_TARGET_GO_MAC="F4:CE:36:00:15:F2"

# -Device Drivers START
# --Wi-Fi drivers START
# ---nRF70 driver START
# Increased from 20000 to handle more scan results (prevents allocation failures)
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=30000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=30000
# Critical for socket packet low latency transmission
CONFIG_NRF_WIFI_LOW_POWER=n
CONFIG_NRF70_RX_NUM_BUFS=10
CONFIG_NRF70_RX_MAX_DATA_SIZE=1600
CONFIG_NRF70_MAX_TX_AGGREGATION=2
CONFIG_NRF70_MAX_TX_TOKENS=5
CONFIG_NRF70_TX_MAX_DATA_SIZE=1600
# ----nRF70 driver END
# --Wi-Fi drivers END
# -Device Drivers START

# -Subsystems and OS Services START
# --Networking START
# Network buffer management for high throughput
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=5
CONFIG_NET_BUF_RX_COUNT=10
CONFIG_NET_BUF_TX_COUNT=10
# CONFIG_NET_PKT_RX_COUNT*CONFIG_NET_BUF_DATA_SIZE
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=15000
# CONFIG_NET_PKT_TX_COUNT*CONFIG_NET_BUF_DATA_SIZE
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=15000

# NET_MAX_CONN / NET_MAX_CONTEXTS are set in prj.conf (8) to cover the
# dual-mode socket budget; do not override them here.

# mDNS resolver (client side) — the headset DISCOVERS the gateway in STA mode by
# resolving "<svc>._nrfwifiaudio._udp.local" via mDNS. prj.conf provides
# MDNS_RESPONDER (answer side) + DNS_RESOLVER, but the resolver only multicasts
# .local queries to 224.0.0.251 when MDNS_RESOLVER is set. Headset-only: the
# gateway is the advertiser and has no flash room for the resolver.
CONFIG_MDNS_RESOLVER=y
# Required so dns_resolve_init_default() registers the mDNS multicast address
# (224.0.0.251:5353) into the default resolver's server list. Without it the
# resolver has no server for .local names and dns_resolve_service() returns
# -ENOENT (-2) synchronously. No static CONFIG_DNS_SERVERx are set — the
# DHCP-provided DNS server is added at runtime; this only seeds the mDNS server.
CONFIG_DNS_SERVER_IP_ADDRESSES=y

# Network management event queue sizing
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
# CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000 (default)

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="audioheadset"

# WPA supplicant thread needs more stack for the P2P group-join path
# (hostap_handler). prj.conf sets 5982 (STA-tuned) which overrides the
# hostap P2P default of 7900 and overflows during 'p2p connect --join'.
# Match the gateway's P2P value.
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=8192
CONFIG_WIFI_NM_WPA_SUPPLICANT_WQ_STACK_SIZE=5632
# --Networking END
# -Subsystems and OS Services END
